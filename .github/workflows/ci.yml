name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: mypy src
      # Tests run against captured fixtures — no network, no secrets needed,
      # so this job stays safe to run on untrusted pull requests.
      - run: python -m pytest
      # Audit the pinned dependencies, not the environment — the environment
      # contains this package itself, which is not on PyPI and cannot be audited.
      - run: pip install pip-audit && pip-audit --strict --requirement requirements.lock
