# Scheduled collection and publication (docs/OPERATIONS.md).
#
# This is the cron in deploy/cron/market-monitor.cron, run on GitHub's
# infrastructure instead of a VPS. It must fire at the UNION of
# [schedule].snapshot and [schedule].analysis in config/default.toml.
#
# The database lives on the orphan `market-data` branch, not on `main`: a
# SQLite file does not delta, so committing it here would bury ~1,500 copies of
# a growing binary in main's history every year. The branch is kept to a single
# commit by amending, and retiring it later is a branch deletion rather than a
# history rewrite.
name: collect

on:
  schedule:
    # Every 10 minutes from 05:02 to 18:52 UTC = 08:32 to 22:22 Asia/Tehran.
    # Iran abolished DST in 2022, so the +3:30 offset holds year-round, which is
    # why Tehran's o'clock lands on UTC's half hour.
    #
    # Two minutes past, not on the minute: GitHub documents the top of the hour
    # as its heaviest load window for scheduled runs, and a run here is already
    # observed starting 7 to 22 minutes late without help.
    #
    # This is the COLLECTION cadence, not the publication one. Publication is
    # driven by [schedule].snapshot and [schedule].analysis in
    # config/default.toml: the first run inside an hourly slot posts a board and
    # an analysis, and each of the five after it rewrites those two messages
    # rather than adding more. So 84 runs a day still produce 26 messages.
    #
    # The window runs an hour past the 21:00 Tehran slot so that last board is
    # refreshed for its full hour like every other. Runs after 21:59 Tehran have
    # passed no slot, so they collect and publish nothing.
    - cron: "2,12,22,32,42,52 5-18 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render but never send to Telegram"
        type: boolean
        default: false

# Runs force-push the same branch. Never let two overlap.
concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TZ: Asia/Tehran
      DATA_DIR: ${{ github.workspace }}/_data

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e .

      - name: Fetch the database
        run: |
          mkdir -p "$DATA_DIR" && cd "$DATA_DIR"
          git init -q -b market-data
          git config user.name  "market-monitor[bot]"
          git config user.email "market-monitor@users.noreply.github.com"
          git remote add origin \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          # `git fetch` exits non-zero both when the branch does not exist yet
          # and when the network is down, and the publish step below force-pushes
          # over a single amended commit. Reading the second as the first once is
          # the end of the dataset, so ask which it is before deciding.
          rc=0
          git ls-remote --exit-code --heads origin market-data >/dev/null || rc=$?
          case "$rc" in
            0)
              git fetch -q --depth 1 origin market-data
              git reset -q --hard FETCH_HEAD
              cp market.db "$RUNNER_TEMP/previous.db"
              echo "restored $(du -h market.db | cut -f1) database"
              ;;
            2)
              echo "no market-data branch yet — starting a fresh database"
              ;;
            *)
              echo "::error::cannot reach the market-data branch (git exit $rc)."
              echo "::error::Refusing to continue — a fresh database here would be force-pushed over the real one."
              exit 1
              ;;
          esac

      # Raw observations are stored before anything is derived from them, so a
      # gated report or a Telegram outage still leaves the quotes on disk. That
      # is why this step does not gate the push below: a dropped collection is
      # the one loss that cannot be back-filled.
      - name: Run the pipeline
        env:
          DATABASE_URL: sqlite:///${{ github.workspace }}/_data/market.db
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          APP_ENV: production
        run: |
          market-monitor run-once ${{ inputs.dry_run && '--dry-run' || '' }}

      # The repository is public and this branch is pushed unattended, so the
      # database is checked rather than assumed. A publisher bug that logged a
      # credential into job_runs would be caught here, before it is published.
      - name: Refuse to push a database containing credentials
        id: scan
        if: always()
        run: python scripts/scan_db_for_secrets.py "$DATA_DIR/market.db"

      # The observation tables only ever grow. A count that fell means this file
      # is not the branch's database with a run appended to it, and force-pushing
      # it would discard history that cannot be re-collected.
      - name: Refuse to push a database that lost history
        id: growth
        if: always()
        run: |
          python scripts/guard_db_growth.py \
            "$RUNNER_TEMP/previous.db" "$DATA_DIR/market.db"

      - name: Publish the database
        if: always() && steps.scan.outcome == 'success' && steps.growth.outcome == 'success'
        working-directory: ${{ github.workspace }}/_data
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "nothing changed"; exit 0
          fi
          # One commit, always: amend the existing tip rather than stacking a
          # new copy of the binary onto it. Safe to force — the concurrency
          # group above guarantees this job is the only writer.
          if git rev-parse -q --verify HEAD >/dev/null; then
            git commit -q --amend -m "data: $(date -u +%FT%TZ)"
          else
            git commit -q -m "data: $(date -u +%FT%TZ)"
          fi
          git push -q --force origin market-data
