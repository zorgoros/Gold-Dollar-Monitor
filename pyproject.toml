[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-monitor"
version = "0.1.0"
description = "Iran market monitor — deterministic price indicators published to Telegram"
# AGPL, not GPL: this runs as a network service, so distribution never happens
# and a plain GPL would bind nobody. See NOTICE for the section 7(b) attribution
# term that comes with it.
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
market-monitor = "market_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
packages = ["market_monitor"]
mypy_path = "src"
strict = true
